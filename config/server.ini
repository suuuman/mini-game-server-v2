; 서버 설정. 값을 바꾸려고 다시 빌드하지 않는다.
;
; ★ 숫자 값은 키마다 허용 범위가 있다. 숫자가 아니거나 범위 밖이면
;   기동 로그에 [WARN] config ... 가 남고 기본값으로 간다 — 조용히 넘어가지 않는다.
;   ⚠️ 한 줄 틀렸다고 서버가 안 뜨지는 않는다. 배포에서 오타 하나가 장애가 되면
;     안 되기 때문이다. 대신 로그를 반드시 확인할 것.
; ⚠️ 음수를 받는 키는 지금 하나도 없다 — 전부 거절된다.
;   한때 frame_pool_capacity = -1 이 size_t 로 넘어가며 곱셈 오버플로로
;   기동을 죽인 적이 있다. 범위 검사는 그 사고에서 나왔다.

[server]
port                 = 9000

; 동시 접속 상한. 0 = 상한 없음.
;   넘으면 accept 직후 그냥 끊는다 — 거절 사유를 보내지 않는다.
;   아직 이 상대가 우리 규약을 쓰는지조차 모르는 시점이라, 알려 주는 것 자체가
;   규약을 모르는 상대에게 규약을 가르쳐 주는 일이 된다.
;
; ⚠️ 상한이 0(없음)이어도 프레임 풀이 사실상의 역압이 된다 — 다만 증상이 다르다.
;   여기서 걸리면 「접속이 거절」되고, 풀에서 걸리면 「붙은 뒤에 끊긴다」.
;   앞은 [CONN ] rejected 로, 뒤는 [POOL ] failed 로 나온다.
;
; 적정값은 종료 로그의 [CONN ] peak 으로 본다.
;   rejected 가 0 이 아닌데 peak 이 상한에 붙어 있으면 상한이 작은 것이고,
;   peak 이 안 붙었는데 rejected 가 나면 세션이 안 지워지고 있다는 뜻이다.
max_connections      = 4096

[io]
; I/O 워커 스레드 수. 0 = 기본값(4).
;
; ★★ 코어 수를 안 본다. 일부러 안 본다 —
;   IOCP 는 「스레드는 넉넉히 만들어 두고, 그중 몇 개만 커널이 깨운다」는 방식이다.
;   동시에 깨어 있을 수는 완료 포트 생성 때 이미 커널에 맡겨 놓았고(0 = 코어 수),
;   여기서 정하는 건 「깨울 수 있는 후보가 몇 개인가」다.
;   ⇒ 이 둘은 원래 다른 숫자다. 코어 수에서 유도하면 같은 숫자로 착각하게 된다.
;
; ⚠️ 20코어에서 4가 맞는지는 잰 적이 없다 — [app] workers 는 쟀지만(ADR-028) 이 값은 아직이다.
;   설정으로 빼 둔 이유가 그것이다: 재컴파일해야 하는 값은 결국 안 재게 된다.
worker_threads       = 0


; ---------------------------------------------------------------------------
;  수신 프레임 풀
; ---------------------------------------------------------------------------
[net]
; 프레임 버퍼를 몇 개 미리 잡아둘 것인가. 0 = 기본값(4096).
;
; ★★ 「개수」다. 「크기」가 아니다 —
;   크기는 kRecvBufferSize(4100B = 4 헤더 + 4096 본문)로 고정이고, 그건
;   kMaxBodySize 에서 파생된 프로토콜 규약이다. 클라이언트와 합의된 값이라
;   설정으로 뺄 수 없고, static_assert 가 버퍼와 묶어 두고 있다.
;   여기서 정하는 건 그 크기의 버퍼를 몇 개나 둘 것인가뿐이다.
;   → 이 값을 바꿔도 와이어에 나가는 바이트는 한 바이트도 안 바뀐다.
;
; 메모리는 4100B × 이 값이다. 4096 이면 약 16.8MB 를 기동 때 통째로 잡는다.
;
; ★ 프레임 하나가 버퍼 하나를 물고 그 세션의 직렬 큐(app::WorkerPool)에 들어간다.
;   그래서 이 값이 곧 「동시에 직렬 큐에 들어갈 수 있는 프레임 수」의 상한이기도
;   하다 — 직렬 큐에 따로 상한을 세는 코드를 안 짜도 되는 이유가 이것이다.
;
; ⚠️ 풀이 비면 그 프레임은 처리 못 하고 세션이 끊긴다. max_connections 와 증상이
;   다르다 — 이쪽은 「붙은 뒤에 끊긴다」, 저쪽은 「아예 못 붙는다」.
;
; 적정값은 종료 로그의 [POOL ] 로 본다. failed 가 0 이 아니면 작은 것이다.
frame_pool_capacity  = 0

; ---------------------------------------------------------------------------
;  접속 헬스체크 — 「말이 끊긴 연결」을 언제 치울 것인가
;
; ★★ 왜 필요한가 — TCP 는 「선이 뽑힌 것」을 알려주지 않는다.
;   상대가 정상 종료(FIN)하면 0바이트 수신으로 알 수 있지만, 랜선이 뽑히거나
;   전원이 나가면 아무 일도 안 일어난다. 서버에서 보면 「조용한 정상 유저」와
;   구분이 안 되고, 그 세션은 영원히 남는다.
;   ⇒ 「조용함」에 상한을 두는 것 말고 방법이 없다.
;
; ★ 「무엇이든 받으면」 살아 있는 것으로 본다. ping 만 세지 않는다 —
;   채팅을 치는 사람은 ping 없이도 살아 있고, ping 만 세면 말이 많은 유저일수록
;   더 잘 끊기는 거꾸로 된 정책이 된다.
; ---------------------------------------------------------------------------

; 이만큼 아무것도 안 오면 끊는다 (초). 0 = 끊지 않는다.   ← 기본
;
; ★★ 기본이 꺼짐인 이유 — scripts\ 의 부하·회귀 하네스가 ping 을 안 보낸다.
;   켜 두면 유휴가 임계를 넘기는 테스트가 전부 실패하는데, 진짜 원인은
;   「하네스가 낡았다」이고 증상은 「서버가 멀쩡한 접속을 끊는다」로 보인다.
;   원인과 증상이 이만큼 벌어지는 기본값은 켜 두면 안 된다.
;
; ★ 켠다면 90 이 권장값이다 — 클라이언트 ping 주기(30초)의 3배.
;   「3회 연속 놓쳐야 끊는다」는 뜻이다. 1배로 잡으면 지연 한 번에
;   멀쩡한 유저가 끊기고, 그건 좀비를 하나 더 두는 것보다 훨씬 나쁘다.
;
; ⚠️ 값을 줄여서 아끼는 메모리가 사실상 없다. 좀비 하나가 약 4.2KB 고
;   대기 중인 Job 이 없어 프레임 풀도 안 먹는다 — 4096개가 전부 좀비여도 16.8MB 다.
;   짧게 잡을 이유가 「메모리」라면 그건 근거가 안 된다.
;
; 적정값은 종료 로그의 [NET  ] idle_kicked 를 [CONN ] peak 과 같이 봐서 정한다.
;   peak 대비 비율이 갑자기 뛰면 임계가 짧거나 클라 ping 이 안 나가는 것이다.
;
; 자체 스폰 9종(zone·members·inventory·zone_block·trade·zone_race·gate·drain·
;   idle — New-HarnessHome/New-VillageHome 경유)은 스크래치 config 에서 이 값을
;   0 으로 고정해 읽는다(idle.ps1 만 자기 시나리오용으로 2 로 다시 덮는다) —
;   ping 을 안 보내는 하네스라 켜 두면 그 자체로 끊긴다. 사전 기동 갈래
;   (send·churn)만 이 파일을 그대로 읽으므로 이 값의 영향을 실제로 받는다.
idle_timeout_sec     = 90

; 몇 초마다 전체 세션을 훑을 것인가. 0 = 기본값(10).
;
; ★ 임계보다 훨씬 짧을 이유가 없다 — 실제로 끊기는 시각은 임계와 임계+주기
;   사이 어딘가다. 90초 임계에 10초 주기면 오차가 최대 11%고, 이 판단에서
;   그 정도 흐릿함은 아무 영향이 없다.
;
; ★ 비용이 거의 0 이다 — 4096세션 순회가 82μs. 10초에 한 번이니 점유율로
;   0.001% 미만이다. 전용 스레드 하나가 깼다 자는 것이 전부다.
;
; ⚠️ 임계보다 크게 잡으면 「실제로 끊는 시각」을 임계가 아니라 이 값이 정하게 된다.
;   그 경우 기동 로그에 [WARN] 이 뜬다.
sweep_interval_sec   = 0

; 송신 큐가 연속으로 몇 번 넘치면 그 세션을 끊을 것인가 — 상대가 안
;   읽어 back(1MB)이 계속 가득 차는 경우다(§17-6). 한 번의 넘침은 순간
;   폭주일 수 있어 봐주지만, 연속이면 회복 신호가 없다고 본다.
;
; ⚠️ 안 쟀다 — 연속 8회면 1MB 큐가 8번 연속 만석이라는 뜻이라 회복 신호가
;   없다고 봤다. 그 이상의 근거는 없다.
;
; 적정값은 종료 로그의 [NET  ] send_full_kicked 를 [CONN ] peak 과 같이
;   봐서 정한다 — 평소 대비 갑자기 늘면 임계가 낮거나 그 세션(들)이
;   정말 안 읽고 있는 것이다.
;
; 0 = 끄기(idle_timeout_sec 과 같은 관례). 세션 서버(session.exe)는 이
;   키를 아예 안 읽어 항상 꺼진 것과 같다 — 그쪽은 락을 쥔 채 송신하는
;   것이 허용 패턴(ARCHITECTURE.md §7 세션 서버 판)이라, 이 킥이 발화하면
;   session_gone_ 이 같은 락을 재획득하려다 자기 데드락이 난다. 마을은
;   그 전제가 없어(불변식 2) 이 값을 켜도 안전하다.
send_overflow_limit  = 8


; ---------------------------------------------------------------------------
;  직렬 큐 워커 — 세션의 실행권을 나눠 먹는 워커 풀(app::WorkerPool)
;
;  옛 [world] zone_threads(존 스레드 고정 배정)를 대신한다. 배정이 zone_id % N 으로
;  고정이던 시절과 달리, 지금은 세션마다 직렬 큐 실행권 하나가 공용 큐를 오가며
;  워커에 유동적으로 배정된다 — 동기 DB 호출 하나가 워커 하나를 묶어도 그
;  워커의 "고정된 다른 세션들"까지 같이 막히지 않는다.
; ---------------------------------------------------------------------------
[app]
; 워커 수. 0 = 기본값(8).
;   로직은 CPU-bound 지만 이 워커가 DB 동기 호출로 블록될 수 있어(§7-4),
;   순수 CPU-bound 였던 옛 존 스레드보다 코어 수를 조금 넘겨 잡는 편이 유리할 수 있다.
;
; ✅ 8 은 잰 값이다(ADR-028 · dbload 격자 · 2026-09-05) — [db] pool_size >= 이 값이면 4/8/12/20 의
;   처리량이 서로 ±5% 안(4 는 8 대비 −12~−18%)이라 더 늘려도 이 부하(PowerShell 클라 32개 버스트)에선 안 보인다.
;   이 값보다 pool_size 가 작을 때만 kBusy 가 난다 — 그 관계가 두 값을 함께 읽는 이유다.
workers              = 0


[log]
; 이 레벨 미만은 아예 안 남긴다 (info · warn · error)
;
; ★★ drop_level 과 다른 것이다. 헷갈리면 둘 다 잘못 잡는다 —
;     level      : 「애초에 안 남긴다」. 큐에 넣지도 않아서 유실로 세지 않는다
;     drop_level : 「남기려 했는데 큐가 찼다」. 그때 무엇을 버릴 것인가
;   앞은 평시 로그량을 줄이는 것이고, 뒤는 사고 났을 때 무엇을 지킬 것인가다.
;
; ⚠️ 알 수 없는 값은 info(다 남긴다)로 간다. 오타 하나로 로그가 조용히 사라지는
;   쪽보다 많이 남는 쪽이 낫다.
level                = info

; 프레임 추적 로그 (1 = 켬 ← 기본 · 0 = 끔)
;   [RECV] · [SEND] · [DB  ] · [DBACK] 넷만 끈다.
;
; ★ 기본이 켬인 이유 — 이 넷이 곧 증거다.
;   [RECV] 와 [DB  ] 의 tid 가 다르면 「I/O 워커와 로직 스레드가 분리돼 있다」이고,
;   [DB  ] 와 [DBACK] 의 tid 가 다르면 「DB 워커가 게임 상태를 안 만진다」이다.
;   회귀도 이 줄들을 보고 판정한다.
;
; ⚠️ 그런데 이 넷은 **프레임 하나·송신 하나마다** 나간다(3,000 프레임에 약 12,000줄).
;   로거의 큐 뮤텍스는 하나라, 동시성을 올리면 여기가 프레임 경로의
;   직렬화 지점이 된다. 대규모로 갈 때 **먼저 끄는 손잡이가 이것**이다.
;
; ⚠️ level 로는 못 끈다 — 넷 다 INFO 급이라 level=warn 으로 올리면
;   기동·종료 로그와 통계까지 통째로 사라진다. 굵기가 안 맞는 손잡이다.
trace_frames         = 1

; 콘솔 출력 (1 = 켬 · 0 = 끔)
;   로깅 비용의 대부분이 콘솔이다. 켜 두면 로거 스레드가 초당 약 2만 줄에서 막히고
;   그만큼 유실이 는다. 개발 편의지 운영 기능이 아니다.
;   기동 로그는 이 설정을 읽기 전이라 항상 콘솔에 보인다.
console              = 1

; 큐가 가득 찼을 때 어느 레벨까지 버릴 것인가
;   none = 아무것도 안 버린다        ← 기본
;   info = 일반 로그만 버리고 [WARN]·[ERROR] 는 지킨다
;   warn = [ERROR] 만 지킨다
;
;   기본이 none 인 이유 — 로그 때문에 큐가 가득 찬다면 그건 로거가 아니라 설정의
;   문제다(로그가 너무 많거나, 콘솔이 켜져 있거나, 상한이 작다). 조용히 버려서 덮으면
;   원인이 안 보인다.
;   ⚠️ none 이어도 하드 상한(queue_limit × 8)에 닿으면 레벨 무관하게 버린다.
;     그 수가 0이 아니면 종료 로그에 따로 나온다 — 설정을 고치라는 신호다.
drop_level           = none

; 큐 상한 (줄). 한 줄 100B 남짓이라 8192 면 약 800KB.
queue_limit          = 8192


; ---------------------------------------------------------------------------
;  DB 접속
;
;  ⚠️ 아래 password 는 예시값이다.
;    설정 파일에 실제 비밀번호를 두는 건 로컬 개발까지다.
;    실서비스에서는 환경변수나 비밀 관리 서비스에서 읽는다.
;
;  계정에 DDL(CREATE/DROP) 권한을 주지 않았다 — sql\00_account.sql 참조.
;  서버는 데이터만 만진다. 스키마 변경은 사람이 한다.
; ---------------------------------------------------------------------------
[db]
host                 = 127.0.0.1
port                 = 3306
user                 = minigame
password             = minigame_public
database             = minigame

; 감사 로그(trade_log)가 들어갈 스키마. 비우면 위 database 에 같이 쓴다.
;
; ★★ 같은 MySQL 인스턴스의 「다른 스키마」다. 다른 서버가 아니다 —
;   그게 이 선택의 전부다. 트랜잭션은 커넥션 단위라, 같은 인스턴스면
;   `minigame_log.trade_log` 로 한정자만 붙여도 거래와 **같은 트랜잭션 안에** 남는다.
;   아이템이 움직인 것과 그 기록이 함께 확정되거나 함께 없던 일이 된다.
;
; ★ 지금 나눠 두는 값어치는 「오늘의 이득」이 아니다 —
;   ① 백업·보존 정책을 스키마 단위로 따로 걸 수 있고
;   ② 나중에 물리적으로 분리할 때 **질의를 한 줄도 안 고친다** (라우팅만 바꾸면 된다)
;
; ⚠️ 서버를 물리적으로 나누는 순간 그 원자성이 사라진다. 그때는 outbox 가 필요하고
;   outbox 는 다시 멱등성 키를 딸고 온다.
;
; ⚠️ 이 스키마는 sql\02_log_schema.sql 로 만든다. 계정에 DDL 권한이 없어서
;   서버가 스스로 만들지 않는다 — 스키마 변경은 사람이 하는 일이다.
;   식별자로 쓸 수 없는 글자가 들어 있으면 기동 로그에 [WARN] 이 남고 게임 DB 에 쓴다.
log_database         = minigame_log

; 트랜잭션 격리 수준 — repeatable-read(기본) · read-committed · serializable
;
; ★ 이 서버의 정합성은 이 값에 기대지 않는다. 차감이 조건부 UPDATE(잠금 읽기)라
;   어느 수준에서도 최신 커밋본을 본다. ⇒ 정합성 손잡이가 아니라 **경합 손잡이**다.
;
; ★★ 어느 쪽이 유리한지는 규모가 정한다 — 그래서 코드에 안 박고 여기 뒀다.
;     지금 규모 : 잠금 접근이 전부 PK 점 접근이라 갭 락이 거의 안 생기고
;                트랜잭션도 짧다 → RC 와 RR 차이가 거의 없다
;     대규모   : 동시 트랜잭션이 늘면 RR 의 오래된 읽기 뷰가 undo 를 붙들어 purge 가 밀리고,
;                새 (player,item) 조합이 쏟아지면 RR 의 갭 락이 삽입을 직렬화한다
;                → 이 구간에서는 read-committed 가 이긴다
;
; ⚠️ read-uncommitted 는 받지 않는다. 거래는 안 깨지지만(잠금 읽기라 무관)
;   **인벤토리 조회**가 롤백될 중간 상태를 보여준다 —
;   유저가 「없는 아이템」을 보고 거래를 건다. 옛 값이 아니라 존재한 적 없는 값이다.
;   그리고 얻는 것도 없다: InnoDB 는 MVCC 라 RC/RR 에서도 일반 SELECT 가 락을 안 잡는다.
;
; ⚠️ 서버 기본값에 기대지 않고 연결마다 못 박는다(MYSQL_INIT_COMMAND — 재연결에도 적용).
;   기대면 DBA 가 transaction_isolation 을 바꾸는 날 코드 주석이 조용히 거짓이 된다.
isolation            = repeatable-read

; DB 연결 수 — try_acquire 가 그 자리에서 빌리는 최대 연결 수다(db_pool.h).
;
; ⚠️ 옛 [db] workers/read_workers 는 폐지됐다(만나면 기동 로그가 말한다) —
;   DB 를 직접 부르는 스레드가 이제 [app] workers 자신이라 「DB 전용 워커 수」가
;   따로 없다. 그래서 이 값과 [app] workers 사이에 예전의 1:1 유도 관계도 없다 —
;   워커 수는 CPU/동시 세션 실행 병렬성이, 이 값은 DB 서버가 감당할 연결 수가 정한다.
;
; 적정값은 종료 로그의 [POOL2] 로 본다 —
;   peak 은 「몇 개나 필요했나」에 답하지 못한다. 주면 다 쓴다.
;   그 질문에 답하는 건 try_failed(유휴가 없고 상한도 찼을 때 즉시 거절한 횟수)다.
;   0이면 넉넉한 것이다.
; ✅ 쟀다(ADR-028 · 2026-09-05) — 규칙은 하나다: **이 값 <= [app] workers**. DB 를 빌리는 스레드가
;   워커뿐이라 동시 대여 수가 워커 수를 못 넘고, 초과분은 쓰이지 않는다(peak 이 workers 에서 멈춘다).
;   4 를 유지하는 이유: 워커 8 중 4 만 DB 에 갇히게 두는 §6-2 격리 손잡이다. 비용은 DB 버스트에서
;   요청 절반이 kBusy(클라 재시도 몫), 효익은 무관 요청의 p99 가 1.3ms 에 머무는 것(풀 8 이면 2.6ms —
;   로컬 DB 0.15~0.5ms/건 조건이라 효익이 작게 보인다. 느린 DB 에서의 효익은 안 쟀다).
;   DB 처리량이 더 급하면 8 로 올린다 — 이 부하에서 busy 0 · ok 처리량 +94%.
pool_size            = 4


; ---------------------------------------------------------------------------
;  틱
; ---------------------------------------------------------------------------
[tick]
; 초당 틱 수. 30Hz = 33.3ms 주기.
;   액션 게임 30~60Hz, MMO 10~30Hz 가 흔하다. 그 이상의 근거는 없다 —
;   게임 디자인이 정할 값이지 서버가 정할 값이 아니고, 지금 그 디자인이 없다.
;
; 전용 틱 스레드 1개(app::TickThread)가 돈다 — 직렬 큐 워커([app] workers)에
;   얹지 않는 이유는 DB 동기 호출로 워커가 막힐 수 있는데, 그 지연이 틱에까지
;   번지면 「틱이 밀렸다」와 「DB 가 느리다」가 같은 스레드에서 섞이기 때문이다.
;
; 0 으로 두면 틱을 끈다(스레드 자체를 안 만든다).
hz                   = 30

; 고해상도 타이머 (1 = 켬 · 0 = 끔)
;   Windows 기본 타이머 해상도는 15.6ms 다. 30Hz(33.3ms)로 재워도 실제로는
;   15.6ms 배수에서만 깨어나서, 간격이 31 과 47 을 오간다.
;   평균은 33.3 으로 맞고 건너뛴 틱도 0이라 「잘 돌고 있다」로 읽히지만,
;   그 상태를 30Hz 라고 말하면 거짓말에 가깝다.
;   ⇒ 평균은 「밀렸나」에, 지터는 「고른가」에 답한다. 다른 질문이다.
;
;   timeBeginPeriod(1) 이 그 해상도를 1ms 로 낮춘다. 비용은 타이머 인터럽트가
;   잦아져 CPU 가 깊은 절전으로 못 내려가는 것인데, 서버 장비는 절전을 기대하지 않는다.
;   ⚠️ 전력·CPU 비용은 재지 않았다. 「서버는 절전 안 한다」는 상식이지 측정이 아니다.
hires_timer          = 1

; ---------------------------------------------------------------------------
;  ★★ 한때 여기에 catch_up_max 가 있었다. 지금은 없다 — 없앤 이유를 남겨 둔다.
;
;  밀린 틱을 몇 칸까지 몰아서 돌 것인가를 정하는 손잡이였다.
;    0 = 전부 건너뛴다 (기본) · N = N 칸까지 · -1 = 무제한 ⚠️ 나선(spiral of death)
;  상한이 곧 정책이었다. 서버는 밀린 그 순간에 「일시적 밀림인지 지속적 밀림인지」를
;  모르기 때문에, 「이만큼까지는 일시적이라고 본다」는 선언 말고는 답이 없었다.
;
;  ⇒ 틱이 dt 대신 「지금 몇 시인가」를 받게 되면서 그 손잡이가 통째로 필요 없어졌다.
;    같은 시각으로 두 번 도는 것은 아무 의미가 없고, 한 번의 틱이 그때까지 만료된
;    것을 전부 거둔다. 한 칸을 지나쳐도 **잃는 일이 없다.**
;
;  ★ 상한으로 막던 문제를, 구조를 바꿔서 없앤 자리다.
;    밀린 정도는 종료 로그의 [TICK ] behind 로 본다 — 손실이 아니라 지연 지표다.
; ---------------------------------------------------------------------------


; ---------------------------------------------------------------------------
;  크래시 덤프
;
;  라이브에서 죽으면 재현이 안 된다. 로그는 「무슨 일이 있었나」를 말하지만
;  「어느 줄에서 죽었나」는 말하지 않는다. 그리고 죽은 뒤에는 다시 만들 방법이 없다.
; ---------------------------------------------------------------------------
; ---------------------------------------------------------------------------
;  S2S — 세션 서버와의 연결 (1단계: 마을 → 세션 서버 등록·하트비트)
;
;  host 가 비어 있으면 이 기능 자체가 꺼진다 — 소켓도 스레드도 안 만든다.
;  ⇒ 이 절이 없거나 비어 있어도 기존 하네스 8종은 전부 무변경이다.
; ---------------------------------------------------------------------------
[s2s]
; 세션 서버 주소. 비우면 비활성(기본).
;   기동 로그에 [INFO] s2s disabled (no host) 한 줄만 남고 커넥터 자체가 안 만들어진다.
;   ⚠️ 세션 서버가 아직 없는 이 환경(기존 하네스 8종)이 이 기본값 하나로 무변경을
;     보장받는다 — 값을 채우는 순간부터 이 기능이 켜진다.
host                 =

; 세션 서버 포트.
port                 = 9100

; 세션 서버에게 "나(이 마을)에게 접속하려면 이 주소로 오라"고 알려 줄 값이다 —
;   이 소켓이 실제로 bind 된 주소가 아니라 광고용이다. 로컬 개발은 127.0.0.1,
;   배포에서는 마을의 실제 도달 가능 주소로 바꿔야 한다.
advertise_host       = 127.0.0.1

; 재연결 백오프 초기값(ms) — 끊기면 이 값에서 시작해 2배씩 backoff_max_ms 까지 늘어난다.
;   연결이 다시 성립하면 이 값으로 리셋된다.
backoff_initial_ms   = 1000

; 재연결 백오프 상한(ms) — 여기 닿으면 더 늘지 않고 이 값으로 무한히 재시도한다.
;   포기하고 죽지 않는다(§5-2) — 세션 서버 쪽 사정(재기동·배포)은 마을이 통제할
;   수 없는 외부 상태라, 마을이 스스로 연결을 끊는 경우(버전 거부 등)도 이 값
;   뒤에 재시도한다.
backoff_max_ms       = 30000

; 요청(Register·Heartbeat 등) 하나가 응답을 못 받았을 때 몇 ms 뒤에 타임아웃으로
; 칠 것인가.
; ⚠️ 안 쟀다 — 세션 서버 왕복 시간을 실측한 적이 없다. 세션 서버가 아직 없어서다.
request_timeout_ms   = 10000

; Heartbeat 송신 주기(ms). "registered" 상태일 때만 나간다 — 재연결 직후
; RegisterAck 를 받기 전에 조기 Heartbeat 가 나가는 것을 그 전이 규칙이 막는다.
; ⚠️ 안 쟀다 — 같은 이유(세션 서버 없음)로 적정 주기를 잴 수 없었다.
;   request_timeout_ms 보다 짧아 하트비트 여러 건이 동시에 in-flight 인 것이
;   정상이다(매칭 테이블이 여러 항목을 동시에 들고 있는 경우를 검증하는 데
;   오히려 쓸모가 있다).
heartbeat_ms         = 5000


; ---------------------------------------------------------------------------
;  village_entry — 마을의 입장 예약 · 예약 만료 스윕 · FullSync 청크 정책
;  (3단계: 마을 연동)
; ---------------------------------------------------------------------------
[village_entry]
; 마을이 인정하는 예약 유효시간의 상한(ms) — 세션 서버가 Reserve 로 보내는
; expire_ms 는 이 값과의 min 으로 클램프된다. 세션 쪽에도 독자적인 예약
; 유효시간이 있는데, 그 둘을 같은 값으로 잡으면 안 된다 — 같으면 "세션이
; 만료시켰다"와 "마을이 만료시켰다"를 구분하는 회귀 단언을 못 세운다.
; ⚠️ 안 쟀다 — 세션 서버 왕복 시간도, 실제 예약 회수량도 실측한 적이 없다.
reserve_expire_ms    = 10000

; 만료된 예약을 회수하는 전용 스레드의 주기(ms).
; ⚠️ 안 쟀다 — 이 주기가 예약 회수량에 어떤 영향을 주는지 실측한 적이 없다.
;   정확성은 이 주기가 아니라 Enter 처리 시점의 lazy 확인이 보장한다
;   (entry_table.h 참조) — 이 스레드는 회수 자체가 도는지를 로그로 보여줄 뿐이다.
sweep_ms             = 30000

; FullSync 한 프레임에 담을 인원 상한. 0 = 파생값(kServerRecvBodyCap 에서
; 나온 상한) 그대로 쓴다. 0 이 아니면 그 값과 파생값의 min 이 실제로 쓰인다 —
; 설정이 세션 서버의 수신 상한을 넘는 프레임을 만들 수 없다.
; ⚠️ 안 쟀다 — 510명이 동시에 한 마을에 입장하는 상황을 실측한 적이 없다.
;   축소값(예: 3)은 회귀 하네스가 청크 분할 루프 자체를 재기 위해 존재한다 —
;   기본값(0)으로는 그 갈래가 하네스에서 한 번도 실행되지 않는다.
fullsync_chunk_max   = 0


[ops]
dump_dir             = dumps

; 0 = 콜스택만 (수백 KB)   ← 기본
; 1 = 전체 메모리 (변수까지 보이지만 수십~수백 MB)
;
; ⚠️ 1 로 켜면 덤프에 플레이어 데이터와 접속 정보가 통째로 들어간다.
;   반출·보관 규정이 있는 곳에서는 그 자체가 사고다. 쫓는 버그가 있을 때만 켠다.
full_memory          = 0

; 크래시 핸들러가 로그 flush 를 몇 ms 까지 기다릴 것인가. 0 = 아예 안 한다.
;
; ⚠️ 무한 대기로 두면 안 된다 — 데드락으로 죽은 거라면 그 락이 영영 안 풀리고,
;   그러면 프로세스가 안 죽고 매달린다. 접속만 받고 응답을 안 하는 상태가 되며
;   감시 프로세스도 「살아 있다」고 보고 재기동을 안 건다.
;   「죽는 것」보다 「안 죽고 이상하게 살아 있는 것」이 운영에는 더 나쁘다.
;   → 못 잡으면 로그를 포기하고 덤프만 남긴다.
log_flush_ms         = 200
