; config/session.ini — 세션 서버(session.exe) 설정
;
; 마을 server.ini 와 같은 규칙 — 파일이 없거나 값이 틀리면 기본값으로 뜬다.
; 값을 바꿀 때는 그 값의 주석(왜 이 값인가)도 같이 갱신할 것.

[server]
; 클라이언트 수용 포트. 마을(9000)·마을 S2S(9100)와 안 겹치는 다음 백 단위.
client_port          = 9200

; 마을 [server] max_connections 와 같은 뜻 — 세션 하나 약 4.2KB 라 4096 이면 17MB 대.
max_connections      = 4096

; 0 = 유휴로 끊지 않는다(기본). 마을과 같은 이유 — 하네스가 ping 을 안 보내므로
; 켜 두면 회귀가 「서버가 멀쩡한 접속을 끊는다」로 실패한다.
; 운영값은 「로그인만 하고 바로 떠나는」 이 서버의 접속 특성을 잰 뒤 정한다
; (ADR-020 결정 10 — A15).
idle_timeout_sec     = 0

[s2s_accept]
; 마을 server.ini [s2s] port=9100 과 대응 — 마을 설정은 손대지 않는다.
port                 = 9100

[registry]
; 동시에 등록할 수 있는 마을 서버 수 상한. 초과분은 RegisterAck result=2(full) 로
; 거절된다. ⚠️ 임의값 — 실제 마을 수 계획이 아직 없다.
capacity             = 16

; 하트비트 헬스 판정 — health_period_ms × health_fail_count 를 넘게 조용하면
; 죽었다고 본다(§4). 5000ms 는 마을의 발신 주기(server.ini [s2s] heartbeat_ms=5000)와
; 같은 값이고, 3회는 「연속 3번 놓쳐야 끊는다」 — net 의 유휴 임계 권장(주기의 3배)과
; 같은 판단이다. 판정은 주기 검사가 아니라 배정 직전 lazy 다(§18-3).
health_period_ms     = 5000
health_fail_count    = 3

; orphan 항목을 지우기까지의 유예(ms) — 재기동한 마을이 같은 host:port 로 부활할
; 창이다. 삭제는 정확성이 아니라 메모리 회수라 길어도 손해가 작다.
; ⚠️ 근거 없음(A8) — 마을 재기동 소요를 실측한 뒤 다시 정한다.
orphan_grace_ms      = 30000

; Unregister 를 받은 연결이 그 뒤 얼마간 heartbeat 를 계속 보내도 끊지 않을
; 것인가(ms) — 마을이 drain(운영 명령) 중에도 연결을 유지한 채 하트비트를
; 보낼 수 있어서다. 항목이 이미 지워졌어도 이 유예 안이면 미등록 heartbeat
; 절단 분기를 타지 않는다. 0 = 유예 없음(이 값이 생기기 전의 기존 동작으로
; 되돌린다).
; 실측(로컬호스트, 세션 서버가 Unregister 에 무응답 — kUnregisterWaitMs
; 타임아웃을 다 채우는 최악의 경로 6회): 마지막 잔여 heartbeat 까지의 간격
; min=933.4ms avg=961.7ms max=975.1ms(회차별 heartbeat 15~16 개, heartbeat_ms=50
; 축소값). 5000 의 약 20% 만 쓴다 — 정상 응답 경로(kUnregisterWaitMs 주석 참조)
; 는 이보다 훨씬 짧아 유예가 더 넉넉하다.
unregister_grace_ms  = 5000

[reserve]
; 예약 유효 시간(ms) — 로그인 응답을 받은 클라가 마을에 실제 접속하기까지의 창
; (§18-1). 만료된 예약은 부하 계산에서 lazy 로 빠진다.
expire_ms            = 10000

; 만료 예약·유예 초과 orphan 회수 주기(ms). 회수는 메모리 반환이 목적이라 낮은
; 빈도면 충분하다(§18-3) — 배정 정확성은 lazy 판정이 따로 지킨다.
sweep_ms             = 30000

; Reserve 응답(pending) 타임아웃(ms). 마을 [s2s] request_timeout_ms=10000 과 같은
; 값으로 맞췄다. ⚠️ 안 쟀다 — 과도기에는 마을이 Unsupported 를 즉시 돌려줘 거의
; 안 걸린다.
request_timeout_ms   = 10000
